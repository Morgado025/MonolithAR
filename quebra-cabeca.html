<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MonolithAR — Quebra-cabeça do robô</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        background: #101015;
        color: #e8e8ee;
        font-family: system-ui, sans-serif;
        padding: 24px;
        display: grid;
        gap: 20px;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }
      @media (min-width: 900px) {
        body { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); }
        #diario-painel { position: sticky; top: 24px; }
      }
      header {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid #2a2a35;
        padding-bottom: 16px;
      }
      h1 { font-size: 1.3rem; font-weight: 600; }
      h2 { margin-top: 28px; font-size: 1.1rem; color: #9fb4ff; }
      main > section:first-child h2:first-child { margin-top: 0; }
      h3 { margin-top: 16px; font-size: 1rem; color: #c7d2ff; }
      p { margin-top: 8px; line-height: 1.5; max-width: 70ch; }
      main { min-width: 0; }
      button {
        background: #4f7cff;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 14px 22px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover { background: #3d68e8; }
      table {
        margin-top: 12px;
        border-collapse: collapse;
        width: 100%;
        font-size: 0.9rem;
      }
      th, td {
        border: 1px solid #2a2a35;
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      th { background: #181820; color: #9fb4ff; }
      /* No celular a tabela rola sozinha, em vez de empurrar a página inteira para o lado. */
      @media (max-width: 700px) {
        table { display: block; overflow-x: auto; }
        th, td { min-width: 9rem; }
      }
      #tela {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        margin-top: 12px;
        border: 1px solid #2a2a35;
        border-radius: 10px;
        background: #15161c;
        /* A órbita da câmera usa o arrasto do dedo; sem isto, o toque rola a página. */
        touch-action: none;
      }
      .controles {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
      }
      .controles label { display: flex; align-items: center; gap: 8px; }
      select {
        background: #181820;
        color: #e8e8ee;
        border: 1px solid #3a3a48;
        border-radius: 8px;
        padding: 12px 10px;
        font-size: 1rem;
      }
      .secundario { background: #2c2c3a; }
      .secundario:hover { background: #3a3a4c; }
      .dica { color: #a0a0b0; font-size: 0.9rem; }
      pre {
        margin-top: 10px;
        padding: 12px;
        background: #16161d;
        border: 1px solid #2a2a35;
        border-radius: 8px;
        font-size: 0.8rem;
        line-height: 1.45;
        overflow-x: auto;
      }
      #arvore td { font-variant-numeric: tabular-nums; }
      #diario-painel {
        background: #16161d;
        border: 1px solid #2a2a35;
        border-radius: 10px;
        padding: 16px;
        max-height: calc(100vh - 48px);
        overflow-y: auto;
      }
      #diario-painel h2 { margin-top: 0; }
      #diario p {
        margin-top: 10px;
        padding: 8px 10px;
        border-left: 4px solid #4a4a55;
        background: #1c1c25;
        font-size: 0.85rem;
        line-height: 1.4;
      }
      .diario-nota { border-left-color: #4f7cff; }
      .diario-alerta { border-left-color: #f97316; }
      .diario-falha { border-left-color: #ef4444; }
    </style>
  </head>
  <body>
    <header>
      <h1>Quebra-cabeça do robô</h1>
      <button id="sondar" type="button">Sondar capacidades</button>
    </header>
    <main>
      <section id="cena">
        <h2>A cena, no regime em janela</h2>
        <canvas id="tela"></canvas>
        <div class="controles">
          <button id="deslizar" class="secundario" type="button">Deslizar a moldura</button>
          <label>Peça <select id="peca"></select></label>
          <button id="prender" type="button">Prender ao contorno</button>
        </div>
        <p class="dica">Arraste para girar a câmera em volta da moldura; role ou pince para aproximar.</p>
        <div id="arvore"></div>
      </section>
      <section id="dominio"></section>
      <section id="regimes">
        <h2>Os três regimes</h2>
        <p>Consultando o navegador…</p>
      </section>
      <section id="sonda">
        <h2>Sonda de capacidades</h2>
        <p>O resultado aparece aqui depois do clique em "Sondar capacidades".</p>
      </section>
    </main>
    <aside id="diario-painel">
      <h2>Diário</h2>
      <div id="diario"></div>
    </aside>
    <script type="module" src="/src/quebracabeca/main.ts"></script>
  </body>
</html>
